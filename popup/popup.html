<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>B站字幕 AI 助手</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 300px; font: 13px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; background: #fff; color: #18191c; }
.head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #f9fafb; border-bottom: 1px solid #e3e5e7; }
.logo { font-size: 18px; }
.title { font-weight: 700; font-size: 14px; color: #fb7299; }
.status { padding: 12px 14px; color: #9499a0; font-size: 12.5px; word-break: break-all; }
.status.ok { color: #00ae66; }
.status.err { color: #fa5a5a; }
.btn {
  display: block; width: calc(100% - 28px); margin: 6px 14px; padding: 9px 0;
  background: #fb7299; color: #fff; border: none; border-radius: 8px;
  font-size: 13px; cursor: pointer; text-align: center;
  transition: filter .15s;
}
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: #fff; color: #61666d; border: 1px solid #e3e5e7; }
.btn.ghost:hover { color: #00a1d6; border-color: #00a1d6; filter: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.footer { padding: 10px 14px 14px; color: #9499a0; font-size: 11.5px; }
</style>
</head>
<body>
<div class="head">
  <span class="logo">📝</span>
  <span class="title">B站字幕 AI 助手</span>
</div>
<div class="status" id="status">检测中…</div>
<button class="btn" id="panelBtn" disabled>打开 AI 侧边栏</button>
<button class="btn ghost" id="optBtn">设置（AI 服务）</button>
<div class="footer">v<span id="ver"></span> · 支持功能：字幕提取 / 同步滚动 / AI 对话</div>
<script src="popup.js"></script>
</body>
</html>
